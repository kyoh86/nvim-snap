name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: |
          mkdir -p dist
          go build -o dist/nvim-snap ./cmd/nvim-snap
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nvim-snap
