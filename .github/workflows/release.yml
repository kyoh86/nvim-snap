name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install luabundler
        run: npm install -g luabundler
      - name: Build bundle
        run: scripts/bundle.sh
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nvim-snap
