name: nvim-snap

on:
  push:
  pull_request:

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim (nightly)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly
      - name: Install nvim-snap
        run: |
          TAG=$(python - <<'PY'
import json, urllib.request
print(json.load(urllib.request.urlopen('https://api.github.com/repos/kyoh86/nvim-snap/releases/latest'))['tag_name'])
PY
          )
          VERSION=${TAG#v}
          ASSET="nvim-snap_${VERSION}_linux_amd64.tar.gz"
          curl -sSL "https://github.com/kyoh86/nvim-snap/releases/download/${TAG}/${ASSET}" -o "${ASSET}"
          tar -xzf "${ASSET}"
          chmod +x nvim-snap
      - name: Restore snapshots cache
        uses: actions/cache@v4
        with:
          path: snapcase/.result
          key: nvim-snap-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nvim-snap-${{ runner.os }}-
      - name: Resolve regression ids
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          BASE=${PR_BASE:-${EVENT_BEFORE:-$GITHUB_SHA}}
          echo "SNAP_BASE=$BASE" >> $GITHUB_ENV
          echo "SNAP_TARGET=$GITHUB_SHA" >> $GITHUB_ENV
      - name: Save regression snapshots
        run: |
          ./nvim-snap regression save --root . --cases-dir snapcase
      - name: Compare regression snapshots
        run: |
          ./nvim-snap regression test --root . --cases-dir snapcase --base "${SNAP_BASE}" --target "${SNAP_TARGET}" --output diff --diff-format html --diff-always
      - name: Run golden tests
        run: |
          ./nvim-snap golden test --root . --cases-dir snapcase --output diff --diff-format html --diff-always
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvim-snap-result
          path: |
            snapcase/.result/**
