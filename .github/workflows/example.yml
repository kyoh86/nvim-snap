# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Examples
on:
  push:
  pull_request:

jobs:
  snapcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Neovim (nightly)
        run: |
          curl -sSL https://github.com/neovim/neovim/releases/download/nightly/nvim-linux64.tar.gz -o nvim-linux64.tar.gz
          tar xzf nvim-linux64.tar.gz
          echo "${PWD}/nvim-linux64/bin" >> "${GITHUB_PATH}"
      - name: Run snapcase examples
        run: |
          go run ./cmd/nvim-snap report \
            --root snapcase-example \
            --cases-dir cases \
            --output diff \
            --diff-format text \
            --diff-always
      - name: Upload diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapcase-example-diff
          path: snapcase-example/.nvim-snap-diff/*
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapcase-example-log
          path: snapcase-example/.nvim-snap-log/*
