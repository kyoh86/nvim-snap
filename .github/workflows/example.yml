# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Examples
on:
  push:
  pull_request:

jobs:
  snapcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim (nightly)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly
      - uses: kyoh86/setup-nvim-snap-action@main
        id: setup
      - uses: actions/cache@v4
        with:
          path: snapcase-example/snapcase/.result
          key: nvim-snap-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nvim-snap-${{ runner.os }}-
      - uses: kyoh86/nvim-snap-action@main
        with:
          nvim-snap-path: ${{ steps.setup.outputs.nvim-snap-path }}
          root: snapcase-example
          cases-dir: snapcase
          diff-format: html
          diff-always: true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapcase-example-result
          path: snapcase-example/snapcase/.result/**
