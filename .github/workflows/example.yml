# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Examples
on:
  push:
  pull_request:

jobs:
  snapcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Neovim (nightly)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly
      - name: Restore snapshots cache
        uses: actions/cache@v4
        with:
          path: snapcase-example/snapcase/.result
          key: nvim-snap-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nvim-snap-${{ runner.os }}-
      - name: Resolve regression ids
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          BASE=${PR_BASE:-${EVENT_BEFORE:-$GITHUB_SHA}}
          echo "SNAP_BASE=$BASE" >> $GITHUB_ENV
          echo "SNAP_TARGET=$GITHUB_SHA" >> $GITHUB_ENV
      - name: Save regression snapshots
        run: |
          go run ./cmd/nvim-snap regression save \
            --root snapcase-example \
            --cases-dir snapcase
      - name: Compare regression snapshots
        run: |
          if find snapcase-example/snapcase/.result/regression -name "snapshot-${SNAP_BASE}.json" -print -quit | grep -q .; then
            go run ./cmd/nvim-snap regression test \
              --root snapcase-example \
              --cases-dir snapcase \
              --base "${SNAP_BASE}" \
              --target "${SNAP_TARGET}" \
              --output diff \
              --diff-format text \
              --diff-always
          else
            echo "base snapshot not found; skip regression compare"
          fi
      - name: Run golden tests
        run: |
          go run ./cmd/nvim-snap golden test \
            --root snapcase-example \
            --cases-dir snapcase \
            --output diff \
            --diff-format text \
            --diff-always
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapcase-example-result
          path: snapcase-example/snapcase/.result/**
