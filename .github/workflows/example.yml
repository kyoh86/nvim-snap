# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Examples
on:
  push:
  pull_request:

jobs:
  snapcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim (nightly)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly
      - name: Install nvim-snap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R kyoh86/nvim-snap -p "nvim-snap_*_linux_amd64.tar.gz"
          tar -xzf nvim-snap_*_linux_amd64.tar.gz
          chmod +x nvim-snap
      - name: Restore snapshots cache
        uses: actions/cache@v4
        with:
          path: snapcase-example/snapcase/.result
          key: nvim-snap-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nvim-snap-${{ runner.os }}-
      - name: Resolve regression ids
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          BASE=${PR_BASE:-${EVENT_BEFORE:-$GITHUB_SHA}}
          echo "SNAP_BASE=$BASE" >> $GITHUB_ENV
          echo "SNAP_TARGET=$GITHUB_SHA" >> $GITHUB_ENV
      - name: Save regression snapshots
        run: |
          ./nvim-snap regression save \
            --root snapcase-example \
            --cases-dir snapcase \
            --id "${SNAP_TARGET}"
      - name: Compare regression snapshots
        run: |
          ./nvim-snap regression test \
            --root snapcase-example \
            --cases-dir snapcase \
            --base "${SNAP_BASE}" \
            --target "${SNAP_TARGET}" \
            --output diff \
            --diff-format html \
            --diff-always
      - name: Run golden tests
        run: |
          ./nvim-snap golden test \
            --root snapcase-example \
            --cases-dir snapcase \
            --output diff \
            --diff-format html \
            --diff-always
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapcase-example-result
          path: snapcase-example/snapcase/.result/**
