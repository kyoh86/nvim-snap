# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Examples
on:
  push:
  pull_request:

jobs:
  snapcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim (nightly)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly
      - uses: kyoh86/setup-nvim-snap-action@main
        id: setup
      - uses: actions/cache@v4
        with:
          path: snapcase-example/snapcase/.result
          key: nvim-snap-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nvim-snap-${{ runner.os }}-
      - name: Resolve regression ids
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          BASE=${PR_BASE:-${EVENT_BEFORE:-$GITHUB_SHA}}
          echo "SNAP_BASE=$BASE" >> $GITHUB_ENV
          echo "SNAP_TARGET=$GITHUB_SHA" >> $GITHUB_ENV
      - uses: kyoh86/nvim-snap-action@main
        with:
          nvim-snap-path: ${{ steps.setup.outputs.nvim-snap-path }}
          root: snapcase-example
          cases-dir: snapcase
          mode: both
          diff-format: html
          diff-always: true
          snapshot-format: json
          skip-on-miss: false
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapcase-example-result
          path: snapcase-example/snapcase/.result/**
